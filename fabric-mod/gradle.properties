# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties - verified against FabricMC/fabric-example-mod branch "26.2"
# Minecraft 26.1+ ships de-obfuscated; Yarn is discontinued and no `mappings`
# line is required (Loom resolves the official Mojang names directly).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2
yarn_mappings=

# Mod Properties
mod_version=2.0.5
maven_group=com.altarsmp.fabric
archives_base_name=altarsmp-fabric
